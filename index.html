<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador CLIF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;--fg:#111827;--muted:#6B7280;--card:#FFFFFF;--line:#E5E7EB;--input:#FFFFFF;--input-line:#D1D5DB;
  --accent:#2457D6;--accent-fg:#FFFFFF;--accent-soft:rgba(36,87,214,.10);
  --pos:#15803D;--pos-soft:rgba(21,128,61,.10);--neg:#C62828;--neg-soft:rgba(198,40,40,.10);--warn:#B45309;--warn-soft:rgba(180,83,9,.11);
  --side:#343A40;--side-fg:#C2C7D0;--side-line:#4B545C;
  --g-panel:#FFFFFF;--g-line:#E6EAF2;--g-neon:#0891B2;--g-neon2:#7C3AED;--g-head1:#0B1120;--g-head2:#1E293B;--g-head-fg:#E0F2FE;
  --g-zebra:rgba(15,23,42,.024);--g-hover:rgba(8,145,178,.07);--g-glow:rgba(8,145,178,.10);
  --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318;--fg:#E7E9EE;--muted:#9CA3AF;--card:#171A21;--line:#2A2F3A;--input:#1E222B;--input-line:#353B48;
  --accent:#7DA2FF;--accent-fg:#0B1020;--accent-soft:rgba(125,162,255,.14);
  --pos:#4ADE80;--pos-soft:rgba(74,222,128,.12);--neg:#F87171;--neg-soft:rgba(248,113,113,.12);--warn:#FBBF24;--warn-soft:rgba(251,191,36,.12);
  --side:#23272B;--side-fg:#C2C7D0;--side-line:#3A4148;
  --g-panel:#0E1320;--g-line:#1C2538;--g-neon:#22D3EE;--g-neon2:#A78BFA;--g-head1:#070B16;--g-head2:#111A30;--g-head-fg:#CFFAFE;
  --g-zebra:rgba(255,255,255,.025);--g-hover:rgba(34,211,238,.08);--g-glow:rgba(34,211,238,.10);--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#111318;--fg:#E7E9EE;--muted:#9CA3AF;--card:#171A21;--line:#2A2F3A;--input:#1E222B;--input-line:#353B48;
  --accent:#7DA2FF;--accent-fg:#0B1020;--accent-soft:rgba(125,162,255,.14);
  --pos:#4ADE80;--pos-soft:rgba(74,222,128,.12);--neg:#F87171;--neg-soft:rgba(248,113,113,.12);--warn:#FBBF24;--warn-soft:rgba(251,191,36,.12);
  --side:#23272B;--side-fg:#C2C7D0;--side-line:#3A4148;
  --g-panel:#0E1320;--g-line:#1C2538;--g-neon:#22D3EE;--g-neon2:#A78BFA;--g-head1:#070B16;--g-head2:#111A30;--g-head-fg:#CFFAFE;
  --g-zebra:rgba(255,255,255,.025);--g-hover:rgba(34,211,238,.08);--g-glow:rgba(34,211,238,.10);--shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
.app{display:flex;min-height:100vh}
/* ---------- menu lateral (padrão financas-app) ---------- */
.side{position:sticky;top:0;height:100vh;width:232px;flex:none;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;transition:width .18s ease-out;overflow:hidden;z-index:20}
.app.collapsed .side{width:64px}
.brand{height:56px;display:flex;align-items:center;gap:10px;padding:0 4px 0 16px}
.brand .av{width:30px;height:30px;border-radius:50%;background:#2A78D6;display:grid;place-items:center;color:#fff;flex:none}
.brand .av svg{width:16px;height:16px}
.brand b{color:#fff;font-size:18px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.collapsed .brand{padding:0;justify-content:center}
.app.collapsed .brand .av,.app.collapsed .brand b{display:none}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:inherit}
.iconbtn:hover{background:rgba(255,255,255,.08)}
.side hr{border:0;border-top:1px solid var(--side-line);margin:0}
.side hr.in{margin:8px 12px}
.nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0}
.nav .sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8A939C;padding:10px 22px 4px;white-space:nowrap}
.app.collapsed .nav .sec{visibility:hidden;height:8px;padding:0}
.nav a{display:flex;align-items:center;gap:14px;height:44px;margin:2px 8px;padding:0 14px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:15px;white-space:nowrap;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:rgba(255,255,255,.10);color:#fff;font-weight:600}
.app.collapsed .nav a{justify-content:center;padding:0}
.app.collapsed .nav a span{display:none}
.side .foot{padding:8px 0}
.side .foot .who{display:flex;align-items:center;gap:14px;height:44px;margin:2px 8px;padding:0 14px;font-size:13px;white-space:nowrap}
.app.collapsed .side .foot .who{justify-content:center;padding:0}
.app.collapsed .side .foot .who span{display:none}
/* ---------- área principal ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10}
.top h1{font-size:20px;font-weight:500;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:13px}
.top .tb{display:flex;align-items:center;gap:8px}
.top .iconbtn:hover{background:var(--accent-soft)}
.role{border:1px solid var(--input-line);background:var(--input);border-radius:10px;padding:6px 8px;font-size:13px;max-width:190px}
.content{padding:20px 24px 48px;max-width:1440px;width:100%}
.proto{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.proto svg{margin-top:1px}
/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.card + .card{margin-top:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.cols{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.sticky{position:sticky;top:84px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f > label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;background:var(--input);border:1px solid var(--input-line);border-radius:12px;padding:9px 12px;min-height:40px;outline:none}
.f{min-width:0}select{max-width:100%;text-overflow:ellipsis}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled{opacity:.6}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--input-line);border-radius:12px;overflow:hidden;background:var(--input)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-size:13px;min-height:38px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--input-line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dan{color:var(--neg);border-color:var(--neg-soft)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--accent-soft);color:var(--accent);line-height:18px}
.badge.pos{background:var(--pos-soft);color:var(--pos)}
.badge.neg{background:var(--neg-soft);color:var(--neg)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.mut{background:rgba(107,114,128,.12);color:var(--muted)}
.badge.mand{background:var(--fg);color:var(--bg)}
.badge svg{width:12px;height:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.total{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.alert{padding:10px 12px;border-radius:12px;font-size:13px;margin:8px 0;display:flex;gap:8px;align-items:flex-start}
.alert svg{width:18px;height:18px;margin-top:1px}
.alert.neg{background:var(--neg-soft);color:var(--neg)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert.pos{background:var(--pos-soft);color:var(--pos)}
ul.clean{margin:4px 0;padding-left:18px}
ul.clean li{margin:2px 0}
/* lista de serviços do agrupamento */
.svc{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.svc:hover{background:var(--g-hover)}
.svc.mand{border-color:var(--line);background:var(--g-zebra)}
.svc.off{opacity:.55}
.svc .nm{flex:1;min-width:0}
.svc .nm b{font-weight:500}
.rulebtn{width:24px;height:24px;border:0;padding:0;background:transparent;color:var(--accent);border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle}.rulebtn:hover{background:var(--accent-soft)}.rulebtn svg{width:16px;height:16px}
.svc .nm .small{display:block;color:var(--muted)}
.svc .amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:96px}
.svc + .svc{margin-top:2px}
table.sumcat{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.sumcat th{font-weight:500;color:var(--muted);text-align:right;padding:2px 4px;font-size:11px}
table.sumcat td{text-align:right;padding:6px 4px;border-bottom:1px dashed var(--line, rgba(127,127,127,.25));white-space:nowrap}
table.sumcat td:first-child,table.sumcat th:first-child{text-align:left}
table.sumcat tfoot td{font-weight:600;border-bottom:0}
@media (max-width:560px){table.sumcat{font-size:11px}table.sumcat .badge{font-size:10px;padding:2px 5px}}
.svc .disc,.svchead .disc{width:84px;flex:none;display:flex;align-items:center;gap:4px}
.svc .disc input{width:62px;padding:4px 6px;text-align:right}
.svchead{display:flex;gap:10px;padding:0 10px 4px 38px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.svchead span:first-child{flex:1}.svchead .amt{min-width:96px;text-align:right}
@media (max-width:560px){.svc{flex-wrap:wrap}.svc .nm{flex-basis:calc(100% - 40px)}.svc .disc{margin-left:28px}.svc .amt{flex:1}.svchead .disc,.svchead .amt{display:none}}
.subh{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px;font-weight:600}
/* ---------- grade (padrão financas-app) ---------- */
.gpanel{border-radius:14px;padding:1px;background:linear-gradient(135deg,var(--g-neon),var(--g-neon2) 40%,var(--g-line) 72%);box-shadow:0 6px 24px var(--g-glow);min-width:0}
.ginner{background:var(--g-panel);border-radius:13px;overflow:hidden}
.gtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px}
.gtool .gs{flex:1 1 220px;position:relative;min-width:160px}
.gtool .gs svg{position:absolute;left:10px;top:10px;width:18px;height:18px;fill:var(--muted)}
.gtool .gs input{padding-left:34px;min-height:38px}
.gtool select{width:auto;min-height:38px;padding:6px 10px;max-width:min(220px,100%)}
.gwrap{overflow-x:auto}
table.g{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.g th{height:38px;background:linear-gradient(180deg,var(--g-head1),var(--g-head2));color:var(--g-head-fg);font-weight:600;font-size:12px;text-align:left;padding:0 10px;white-space:nowrap;border-bottom:2px solid var(--g-neon);user-select:none;position:relative}
table.g th.s{cursor:pointer}
table.g th.on{color:var(--g-neon)}
table.g th.num{text-align:right}
table.g td{height:36px;padding:4px 10px;border-bottom:1px solid var(--g-line);vertical-align:middle}
table.g tbody tr:nth-child(even){background:var(--g-zebra)}
table.g tbody tr:hover{background:var(--g-hover)}
table.g tbody tr.click{cursor:pointer}
table.g tbody tr.sel{background:var(--accent-soft)}
table.g td:first-child{box-shadow:inset 3px 0 0 var(--stripe,transparent)}
table.g tfoot td{font-weight:600;border-top:2px solid var(--g-line);border-bottom:0;height:40px}
table.g td.wrap{white-space:normal;min-width:220px}
.gpanel.compact table.g th,.gpanel.compact table.g td{padding-left:6px;padding-right:6px}
.gpanel.compact table.g td.wrap{min-width:130px}
.gpanel.compact table.g input[type=text]{min-height:30px;padding:3px 6px;font-size:13px}
.gpanel.compact table.g select{min-height:30px;padding:3px 6px}
.gpanel.compact .iconbtn{width:30px;height:30px}
table.g td.cb,table.g th.cb{width:36px;padding:0 0 0 12px}
table.g input[type=checkbox]{width:16px;height:16px;accent-color:var(--g-neon)}
table.g select{min-width:110px}table.g input[type=number],table.g select{min-height:30px;padding:3px 8px;border-radius:8px;font-size:13px}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.gfoot .pg{display:flex;gap:4px;align-items:center}
.gbulk{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--accent-soft);font-size:13px;flex-wrap:wrap}
details.cols{position:relative}
details.cols summary{list-style:none;cursor:pointer}
details.cols summary::-webkit-details-marker{display:none}
details.cols .menu{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;z-index:30;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto}
details.cols .menu .chk{padding:4px 0;font-size:13px}
details.cols.acts .menu .btn{display:flex;width:100%;justify-content:flex-start;margin:4px 0}
/* ---------- diálogos ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;z-index:100;padding:16px}
.dlg{background:var(--card);color:var(--fg);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg.wide{width:min(980px,100%)}
.dlg header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px 20px}
.dlg header h3{margin:0;font-size:17px;font-weight:600;flex:1}
.dlg header .iconbtn:hover{background:var(--accent-soft)}
.dlg .body{padding:4px 20px 16px;overflow:auto}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 18px;border-radius:12px;z-index:200;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
/* ---------- assistente de importação ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps .st{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12.5px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.steps .st b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);font-size:11px}
.steps .st.on{border-color:var(--accent);color:var(--accent)}
.steps .st.on b{background:var(--accent);color:var(--accent-fg)}
.steps .st.ok b{background:var(--pos);color:#fff}
.drop{border:2px dashed var(--input-line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
/* ---------- gráficos ---------- */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .bar{fill:url(#gBar)}
.chart .axis{stroke:var(--line)}
.hbar{display:grid;grid-template-columns:minmax(0,170px) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{height:10px;border-radius:999px;background:var(--g-line);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g-neon),var(--g-neon2))}
.cols.lkk{grid-template-columns:repeat(4,minmax(0,1fr))}.cols.lkk .card{margin-top:0}@media (max-width:900px){.cols.lkk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hbar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---------- simulador (visual limpo) ---------- */
.simpage{--accent:#0F766E;--accent-fg:#fff;--accent-soft:rgba(15,118,110,.10);--hero1:#0F766E;--hero2:#115E59}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .simpage{--accent:#2DD4BF;--accent-fg:#042F2E;--accent-soft:rgba(45,212,191,.14);--hero1:#115E59;--hero2:#134E4A}}
:root[data-theme="dark"] .simpage{--accent:#2DD4BF;--accent-fg:#042F2E;--accent-soft:rgba(45,212,191,.14);--hero1:#115E59;--hero2:#134E4A}
.simpage .card{border-radius:14px;padding:18px 20px}
.simpage .card h2{font-size:17px;font-weight:600;margin-bottom:14px}
.hic{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.hic svg{width:18px;height:18px}
.frow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0;padding-top:0}
.fcap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:24px}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.fgrid .f.w2{grid-column:span 2}
.simpage .fgrid input,.simpage .fgrid select{min-height:36px;padding:6px 10px;border-radius:10px}
.simpage .f > label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg.c3f{grid-template-columns:repeat(3,minmax(0,1fr))}

/* ===== Simulador CLIF v2 — modelo normalizado + motor de cálculo puro ===== */

const CLASSES = { PADRAO:'Padrão', EXTRA:'Extra', NA:'N/A (não se aplica)', NAO_COBRAVEL:'Não cobrável', ESPECIAL:'Condição especial', ADICIONAL:'Serviço adicional' };
const CATEGORIES = ['TRANSPORTE','ARMAZENAGEM','MOVIMENTAÇÃO','CUSTO EXTRA','REPASSE PORTO','ARMAZÉM GERAL'];
// Lista de categorias editável (db.categories). O id é fixo; o nome pode ser renomeado pelo usuário e é propagado aos serviços.
const CAT_SEED = [['TRANSPORTE','#2457D6'],['ARMAZENAGEM','#0891B2'],['MOVIMENTAÇÃO','#7C3AED'],['CUSTO_EXTRA','#6B7280','CUSTO EXTRA'],['REPASSE PORTO','#B45309'],['ARMAZÉM GERAL','#15803D']];
function seedCategories() { return CAT_SEED.map(([id, color, name]) => ({ id, name: name || id, color, active: true })); }
// v6: categoria OUTROS passa a se chamar CUSTO EXTRA (pedido do Ivo) e a lista vira cadastro
function migrateCategories(db) {
  const log = [];
  if (!Array.isArray(db.categories)) db.categories = seedCategories();
  const ren = (from, to) => { let n = 0; for (const sv of db.services) if (sv.category === from) { sv.category = to; n++; } for (const cc of db.conditional || []) cc.base.categories = cc.base.categories.map(c => c === from ? to : c); return n; };
  const n = ren('OUTROS', 'CUSTO EXTRA'); if (n) log.push(n + ' serviço(s) de OUTROS → CUSTO EXTRA');
  for (const sv of db.services) if (sv.category && !db.categories.some(c => c.name === sv.category)) { db.categories.push({ id: sv.category, name: sv.category, color:'#6B7280', active:true }); log.push('categoria ' + sv.category + ' incluída na lista'); }
  return log;
}
// Bases de cobrança: qual quantidade da simulação multiplica a tarifa.
const BASES = {
  CONTAINER:{ label:'Por container', qty:'unidades', pct:false },
  VEICULO:{ label:'Por veículo', qty:'unidades', pct:false },

};

function applyAgrPlanilha(db) {
  const log = [];
  if (!db.services.some(s => s.code === 'MOV_FLAT')) { const mv = db.services.find(s => s.code === 'MOV'); db.services.push({ ...JSON.parse(JSON.stringify(mv)), code:'MOV_FLAT', name:'Movimentação de container flat rack/open top (handling in + out)', active:true }); log.push('serviço MOV_FLAT criado'); }
  const mv = db.services.find(s => s.code === 'MOV'); if (mv && mv.name === 'Movimentação de container (handling in + out)') mv.name = 'Movimentação de container standard (handling in + out)';
  const ce = db.services.find(s => s.code === 'CTRL_ENT'); if (ce && ce.category !== 'MOVIMENTAÇÃO') { ce.category = 'MOVIMENTAÇÃO'; log.push('CTRL_ENT → categoria MOVIMENTAÇÃO'); }
  for (const [gid, a] of Object.entries(AGR_PLANILHA)) {
    const g = db.groups.find(x => x.id === gid); if (!g) continue;
    if (g.name !== a.name) { log.push(gid + ': nome ' + g.name + ' → ' + a.name); g.name = a.name; }
    const old = db.links.filter(l => l.group === gid); const byS = Object.fromEntries(old.map(l => [l.svc, l]));
    const removed = old.filter(l => !a.svcs.includes(l.svc)).map(l => l.svc), added = a.svcs.filter(c => !byS[c]);
    db.links = db.links.filter(l => l.group !== gid);
    a.svcs.forEach((c, i) => { const o = byS[c]; db.links.push(o ? { ...o, order: i + 1 } : { id: gid + '|' + c, group: gid, svc: c, def: false, mandatory: false, cond: null, mult: 1, active: true, order: i + 1 }); });
    if (removed.length || added.length) log.push(gid + ': ' + (added.length ? '+' + added.join(',') : '') + (removed.length ? ' −' + removed.join(',') : ''));
  }
  return log;
}

// ---------- utilitários de tarifa ----------
function groupLinks(db, gid) { return (db.links || []).filter(l => l.group === gid).sort((a, b) => a.order - b.order); }
function tableChain(db, tableId) { const out = []; let t = db.tables.find(x => x.id === tableId); while (t && out.length < 5) { out.push(t); t = t.inherits ? db.tables.find(x => x.id === t.inherits) : null; } return out; }
// reg: regime da simulação (DTA/DTC). Tarifa específica do regime tem prioridade; sem ela vale a tarifa "Todos" (reg vazio).
// Tabela geral (group '*'): tarifas que valem para todos os agrupamentos (ex.: custo extra). Só é usada quando a tabela da
// operação não tem valor para o serviço; cotação/indisponível na tabela da operação continuam valendo (não são substituídos).
const GLOBAL_GROUP = '*';
// v9: tarifas cadastradas por serviço numa lista única (tabela TARIFAS, vale para todos os agrupamentos);
// variáveis da linha: cliente (vazio = todos), tipo de container e regime.
const MASTER_TABLE = 'TARIFAS';
const masterTable = () => ({ id: MASTER_TABLE, name:'Tarifas por serviço', group: GLOBAL_GROUP, master:true, cts:[], owner:'CLIF', customer:null, context:'Lista', status:'Ativa', version:'1', inherits:null, created:new Date().toISOString(), modified:new Date().toISOString(), createdBy:'Sistema', note:'', entries:[], condRates:{} });
const isGlobalTable = t => !!t && t.group === GLOBAL_GROUP;
function findGlobal(db, sim, svc, ct, reg = '') {
  const ts = db.tables.filter(t => isGlobalTable(t) && t.status === 'Ativa' && t.id !== sim.table && (!t.customer || t.customer === sim.customer))
    .sort((a, b) => (b.customer ? 1 : 0) - (a.customer ? 1 : 0));
  for (const t of ts) {
    let e = findEntry(db, t.id, svc, ct, reg, sim.customer);
    if (!e || e.value == null) { const x = t.entries.find(x => x.svc === svc && x.value != null && (!x.reg || x.reg === reg) && x.papel !== 'Concorrente' && (!entCustKey(x) || entCustKey(x) === sim.customer)); if (x) e = { ...x, table: t, viaFallback: x.ct !== ct, entry: x }; }
    if (e && e.value != null) return { ...e, global: true };
  }
  return null;
}

// Ordem: cliente+container+regime > cliente+container+todos > geral+container+regime > geral+container+todos (container Dry de reserva por último em cada nível).

let DLG = null;
function openDialog({ title, body, actions = [], wide = false, onOpen }) {
  closeDialog();
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="dlg${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="iconbtn" data-dlg-close aria-label="Fechar">${ic('close')}</button></header><div class="body">${body}</div>${actions.length ? `<footer>${actions.map((a, i) => `<button class="btn ${a.primary ? 'pri' : ''} ${a.danger ? 'dan' : ''}" data-dlg="${i}" ${a.disabled ? 'disabled' : ''}>${esc(a.label)}</button>`).join('')}</footer>` : ''}</div>`;
  document.body.appendChild(sc);
  DLG = { el: sc, actions };
  sc.addEventListener('click', e => {
    if (e.target === sc || e.target.closest('[data-dlg-close]')) return closeDialog();
    const b = e.target.closest('[data-dlg]'); if (b) { const a = actions[+b.dataset.dlg]; if (a && a.fn) { if (a.fn(sc.querySelector('.body')) !== false) closeDialog(); } else closeDialog(); }
  });
  sc.addEventListener('keydown', e => { if (e.key === 'Escape') closeDialog(); });
  const f = sc.querySelector('.body input, .body select, .body textarea, footer .btn.pri'); if (f) setTimeout(() => f.focus(), 30);
  if (onOpen) onOpen(sc.querySelector('.body'));
  return sc.querySelector('.body');
}

function gridRows(id) {

};

PAGES.servicos = { title:'Serviços calculados', sub:'Memória de cálculo da simulação atual',
  render() {

    return `<div class="actions" style="margin-bottom:12px">${stateBadge(r.state)}<span class="muted">${esc(entName(sim.customer))} · ${esc(grpLabel(sim.group))} · ${esc(tblLabel(tblBy(sim.table)))}</span><span style="flex:1"></span><button class="btn" data-go="simulador">${ic('calc')} Voltar ao simulador</button><button class="btn" data-act="simCopy">${ic('copy')} Copiar resumo</button></div>

      stripe: r => catColor(r.category), onRow: r => adjustDlg(r),

        { k:'amount', label:'Sem impostos', num:true, get: r => r.amount, html: r => r.amount == null ? '<span class="neg">bloqueante</span>' : brl(r.amount) + (r.adjusted ? `<div class="small muted">orig. ${brl(r.original)}</div>` : '') },
        { k:'gross', label:'Com impostos', num:true, get: r => r.gross, html: r => brl(r.gross) },

// Botão "+ Tarifa" na linha sem valor: grava a tarifa na tabela (nova versão) e recalcula a simulação
const canAddRate = l => can('tarifas') && l.amount == null && l.origin !== 'condicional' && l.rule !== 'Aguardando câmbio' && !!svcBy(l.svc);
ACT.calcAddRate = el => {
  const l = curResult().lines.find(x => x.svc === el.dataset.svc); if (!l) return;
  const sv = svcBy(l.svc), pu = !!(BASES[sv.basis] && BASES[sv.basis].pct), rep = sv.taxGroup === 'repasse';
  const g = grpBy(sim.group), ct = g && ['AWB','VEICULO','AG'].includes(g.flags.unit) ? 'NA' : sim.ct;
  const T = tblBy(MASTER_TABLE);
  openDialog({ title:'Adicionar tarifa: ' + sv.name, body:`<p class="muted small" style="margin-top:0">${esc(sv.code)} · ${esc(BASES[sv.basis].label)} · ${esc((ctBy(ct) || {}).name || ct)}. A tarifa é gravada na lista de tarifas por serviço (nova versão) e a simulação é recalculada.</p><div class="fg">
    <div class="f" style="grid-column:1/-1"><label>Vale para</label><select name="cust"><option value="">Todos os clientes (tarifa geral)</option>${sim.customer ? `<option value="${esc(sim.customer)}">Somente ${esc(entName(sim.customer))}</option>` : ''}</select></div>
    <div class="f"><label>Valor ${pu ? '(%)' : '(R$)'} *</label><input type="text" inputmode="decimal" name="value" placeholder="${pu ? 'ex.: 0,23' : 'ex.: 450,00'}"></div>
    <div class="f"><label>Mínimo (R$)</label><input type="text" inputmode="decimal" name="min"></div>
    <div class="f"><label>Base do mínimo</label><select name="mb"><option value="">—</option>${Object.entries(MIN_BASES).map(([v, x]) => `<option value="${v}">${x}</option>`).join('')}</select></div>
    <div class="f"><label>Regime</label><select name="reg"><option value="">Todos</option>${['DTA','DTC'].map(x => `<option>${x}</option>`).join('')}</select></div>
    ${rep ? '' : '<div class="f"><label>Taxa IMO (×)</label><input type="text" inputmode="decimal" name="fImo" placeholder="—"></div><div class="f"><label>Taxa fora do padrão (×)</label><input type="text" inputmode="decimal" name="fOog" placeholder="—"></div>'}</div>`,
    actions:[{ label:'Cancelar' }, { label:'Salvar tarifa', primary:true, fn: b => {
      const t = T, cust = val(b, 'cust'); const v = fromDisp(pu, val(b, 'value')), mn = fromDisp(false, val(b, 'min')), reg = val(b, 'reg');
      const fi = rep ? null : parseNum(val(b, 'fImo')), fo = rep ? null : parseNum(val(b, 'fOog'));
      if (v == null || Number.isNaN(v) || v < 0) { toast('Informe o valor da tarifa.'); return false; }
      if (Number.isNaN(mn) || (mn != null && mn < 0)) { toast('Mínimo inválido.'); return false; }
      if ([fi, fo].some(x => Number.isNaN(x) || (x != null && x <= 0))) { toast('Taxa inválida: informe um número maior que zero (ex.: 1 ou 0,5).'); return false; }
      bumpVersion(t, 'Tarifa incluída pelo simulador: ' + sv.code);
      const data = { value: v, min: mn, minBasis: val(b, 'mb') || null, fImo: fi, fOog: fo, status:'confirmado', src:'Cadastro pelo simulador · ' + userName() };
      const ex = t.entries.find(x => x.svc === sv.code && x.ct === ct && (x.reg || '') === reg && (x.cust || '') === cust && entPapel(x) === (cust ? 'Cliente' : ''));
      const ne = { svc: sv.code, ct, ...(reg ? { reg } : {}), ...(cust ? { cust } : {}), currency:'BRL', cands:[], ...data }; ne.id = entryKey(ne);
      if (ex) Object.assign(ex, data); else t.entries.push(ne);
      audit('Tarifa incluída pelo simulador', t.id, entryKey(ne) + ' = ' + (pu ? pct(v) : brl(v))); persist(); rerenderPage();
      toast('Tarifa salva (lista v' + t.version + '). Simulação recalculada.');
    } }] });
};
function adjustDlg(l) {
  if (!can('ajustar')) return toast('O perfil atual não pode ajustar valores.');
  const a = sim.adj[l.svc];

const CMP_DIMS = { tabelas:'Tabelas', clientes:'Clientes', containers:'Tipos de container', agrupamentos:'Operações' };
function cmpOptions(dim) {
  if (dim === 'tabelas') return db.tables.filter(t => t.status !== 'Inativa').map(t => [t.id, t.name]);
  if (dim === 'clientes') return db.entities.filter(e => e.roles.includes('Cliente')).map(e => [e.id, e.name]);
  if (dim === 'containers') return db.containerTypes.filter(c => c.active && c.id !== 'NA').map(c => [c.id, c.name]);
  return db.groups.filter(g => g.active).map(g => [g.id, g.name]);
}
function cmpDefault(dim) {
  if (dim === 'tabelas') { const same = groupTables(sim.group).map(t => t.id); return [...new Set([sim.table, ...same, ...db.tables.filter(t => t.status !== 'Inativa').map(t => t.id)].filter(Boolean))].slice(0, 3); }
  if (dim === 'clientes') return cmpOptions(dim).slice(0, 2).map(x => x[0]);
  if (dim === 'containers') return ['DRY', 'REEFER', 'FLAT'];
  return [...new Set([sim.group, 'G-DMAN', 'G-SEM'])].slice(0, 3);
}
function cmpVariants(dim, picks) {
  return picks.map(p => {
    const s = clone(sim);
    if (dim === 'tabelas') { s.table = p; s.adj = {}; return { label: (tblBy(p) || {}).name || p, sim: s }; }
    if (dim === 'clientes') { s.customer = p; pickTableFor(s); return { label: entName(p), sim: s }; }
    if (dim === 'containers') { s.ct = p; return { label: (ctBy(p) || {}).name, sim: s }; }
    s.group = p; s.sel = {}; s.extras = []; s.condOff = {}; s.adj = {}; return { label: grpLabel(p), sim: s };
  });
}
function cmpTableHTML(vars, id) {
  const res = vars.map(v => compareVariant(db, v.sim));

  const both = rows.filter(r => res.every((_, i) => r['v' + i] != null));

  const delta = (r, i) => (r['v' + i] == null || r.v0 == null) ? '' : (() => { const d = r['v' + i] - r.v0; return `<span class="${d > 0 ? 'neg' : d < 0 ? 'pos' : 'muted'}">${d > 0 ? '+' : ''}${brl(d)}</span>`; })();
  const cols = [{ k:'name', label:'Serviço', wrap:true }];

      <div class="card"><h2>Situação de cada coluna</h2>${vars.map((v, i) => `<div class="kv"><span>${esc(v.label)}</span><span>${stateBadge(res[i].state)}${res[i].competitor ? ' <span class="badge mut">indicativo</span>' : ''}</span></div>`).join('')}</div>

// ================= TARIFAS =================
// Tabela = ID + agrupamento (operação). Ao criar, todos os serviços do agrupamento entram sem valor,
// para o usuário preencher manualmente ou por Excel (mesmo layout na exportação e na importação).
function bumpVersion(t, note) {
  t.history = t.history || [];
  t.history.unshift({ version: t.version, at: t.modified, user: t.modifiedBy || t.createdBy, note: t.lastNote || 'Versão anterior', entries: clone(t.entries), condRates: clone(t.condRates || {}) });
  if (t.history.length > 30) t.history.length = 30;
  const m = String(t.version).match(/^(.*?)(\d+)$/); t.version = m ? m[1] + (+m[2] + 1) : t.version + '.1';
  t.modified = nowISO(); t.modifiedBy = userName(); t.lastNote = note;
}
const entryKey = e => e.svc + ':' + e.ct + (e.reg ? ':' + e.reg : '') + (e.cust ? '@' + e.cust : '') + (e.papel && e.papel !== 'Cliente' ? '#' + e.papel : '');
// mesma linha = mesmo serviço, container, regime, entidade e papel
const sameLine = (a, b) => a.svc === b.svc && a.ct === b.ct && (a.reg || '') === (b.reg || '') && (a.cust || '') === (b.cust || '') && entPapel(a) === entPapel(b);
const REGS = { '':'Todos', DTA:'DTA', DTC:'DTC' };
// Número em formato brasileiro ou internacional: "1.234,56", "0,23", "0.23", "R$ 10", "0,23%".
function parseNum(raw) {
  if (raw === '' || raw == null) return null;
  if (typeof raw === 'number') return isFinite(raw) ? raw : NaN;
  let t = String(raw).replace(/[R$\s%]/g, '').replace(/ /g, '');
  if (t === '') return null;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  const n = +t; return isFinite(n) ? n : NaN;
}
// Percentuais aparecem e são digitados em % (0,23 = 0,23%); internamente ficam como fração.
const toDisp = (pctUnit, v) => v == null ? '' : pctUnit ? String(+(v * 100).toFixed(6)).replace('.', ',') : String(v).replace('.', ',');
const fromDisp = (pctUnit, s) => { const n = parseNum(s); if (n == null || isNaN(n)) return n; return pctUnit ? n / 100 : n; };
const groupCts = g => g && g.flags.unit ? ['NA'] : null;
const tableConds = t => { if (isGlobalTable(t)) return []; const g = grpBy(t.group); const ag = !!(g && g.flags.ag); return db.conditional.filter(c => !c.retired && (ag ? c.type === 'AG' : c.type !== 'AG')); };
const condIsPct = c => c.mode !== 'minimo';
// Tabela para todos os agrupamentos: lista os serviços ativos da categoria custo extra
function globalEntries(cts) { const out = []; for (const sv of db.services) if (sv.active && sv.category === catName('CUSTO_EXTRA')) for (const ct of cts) out.push({ id: sv.code + ':' + ct, svc: sv.code, ct, value: null, min: null, minBasis: null, currency:'BRL', status:'pendente', src:'', cands:[] }); return out; }
function groupEntries(g, cts) {
  if (!g) return [];
  const out = [];
  for (const m of groupLinks(db, g.id)) if (m.active !== false) for (const ct of (groupCts(g) || cts)) if (!out.some(e => e.svc === m.svc && e.ct === ct)) out.push({ id: m.svc + ':' + ct, svc: m.svc, ct, value: null, min: null, minBasis: null, currency:'BRL', status:'pendente', src:'', cands:[] });
  return out;
}

function markDirty() { const n = draftCount(ui.tableId); const bar = document.getElementById('tsave'); if (bar) { bar.style.display = n ? '' : 'none'; document.getElementById('tdirty').textContent = n + ' alteração(ões) não salvas'; } }

ACT.tblBack = () => { if (draftCount(ui.tableId)) return toast('Salve ou descarte as alterações antes de voltar.'); ui.tblOpen = false; persist(); rerenderPage(); };
ACT.tblDiscard = () => { delete TDRAFT[ui.tableId]; rerenderPage(); };
ACT.tblSave = () => {
  const t = tblBy(ui.tableId); const d = draftOf(t.id);
  for (const [k, c] of Object.entries(d.entries)) {
    if (c.value != null && c.value < 0) return toast('Valor negativo em ' + k + '.');
    if (c.min != null && c.min < 0) return toast('Mínimo negativo em ' + k + '.');
    if (c.value == null && (c.status === 'confirmado' || c.status === 'adotado')) return toast(k + ': sem valor, o status precisa ser Pendente, Cotação ou Indisponível.');
  }
  const n = draftCount(t.id); if (!n) return;
  bumpVersion(t, 'Edição manual: ' + n + ' alteração(ões)');
  const changes = [];
  for (const [k, c] of Object.entries(d.entries)) { const e = t.entries.find(x => entryKey(x) === k); if (!e) continue; changes.push(k + ': ' + (e.value ?? '—') + ' → ' + (c.value ?? '—')); Object.assign(e, c, { src: 'Cadastro manual · ' + userName() }); }
  t.condRates = t.condRates || {};
  for (const [id, v] of Object.entries(d.cond)) { changes.push(id + ': ' + (t.condRates[id] ?? 'padrão') + ' → ' + (v ?? 'padrão')); if (v == null) delete t.condRates[id]; else t.condRates[id] = v; }

  delete TDRAFT[t.id]; persist(); rerenderPage(); toast('Salvo. ' + t.id + ' agora na v' + t.version + '.');
};

function setRepasse(s, rep) {

  audit('Repasse alterado', s.code, (rep ? 'Sim' : 'Não') + (n ? ' · taxas IMO/fora do padrão removidas de ' + n + ' tarifa(s)' : ''));
  if (n) toast(s.code + ' agora é repasse: taxas IMO e fora do padrão removidas de ' + n + ' tarifa(s).');
}

        { k:'mult', label:'Mult.', sort:false, num:true, html: r => `<input type="number" min="1" step="1" style="width:64px" value="${r.mult}" data-act-change="linkField" data-id="${esc(r.id)}" data-k="mult" ${ro} aria-label="Multiplicador">` },

// Vínculos visíveis com os filtros de agrupamento e serviço (base do grid e dos KPIs)
function linkRows() {
  const gid = ui.linkGroup && grpBy(ui.linkGroup) ? ui.linkGroup : '', sid = ui.linkSvc && svcBy(ui.linkSvc) ? ui.linkSvc : '';

}
// KPIs da tela 3: totais dos vínculos filtrados (agrupamento/serviço) e distribuição por categoria
function linkKpisHTML() {
  const rows = linkRows(), n = rows.length, cnt = f => rows.filter(f).length;
  const groups = new Set(rows.map(r => r.group)).size, svcs = new Set(rows.map(r => r.svc)).size;
  const act = cnt(r => r.active), def = cnt(r => r.def), mand = cnt(r => r.mandatory), pc = x => n ? Math.round(x / n * 100) + '%' : '—';
  const kpi = (l, v, d, cls) => `<div class="card kpi"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;

  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]), max = Math.max(1, ...cats.map(c => c[1]));
  return `<div class="cols lkk">${kpi('Vínculos', n, groups + ' agrupamento(s) · ' + svcs + ' serviço(s)')}${kpi('Padrão', def, pc(def) + ' dos vínculos')}${kpi('Obrigatórios', mand, pc(mand) + ' dos vínculos')}${kpi('Ativos', act, (n - act) + ' inativo(s)', n - act ? '' : 'pos')}</div>
    ${cats.length ? `<div class="card" style="margin-top:16px"><h2 style="margin-bottom:6px">Vínculos por categoria</h2>${cats.map(([c, v]) => `<div class="hbar"><span class="lb" title="${esc(c)}"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span><span class="tr"><i style="width:${v / max * 100}%;background:${catColor(c)}"></i></span><span class="num">${v}</span></div>`).join('')}</div>` : ''}`;

const refreshLinkKpis = () => { const k = document.getElementById('lk-kpis'); if (k) k.innerHTML = linkKpisHTML(); };
ACT_CHANGE.linkSvc = el => { ui.linkSvc = el.value; if (GS.links) { GS.links.sel.clear(); GS.links.page = 0; } persist(); rerenderPage(); };

ACT.linkMove = el => { const l = linkBy(el.dataset.id); const ls = groupLinks(db, l.group); const i = ls.indexOf(l), j = i + +el.dataset.d; if (j < 0 || j >= ls.length) return; [ls[i].order, ls[j].order] = [ls[j].order, ls[i].order]; persist(); gridRefresh('links'); };
function unlink(rows) {
  confirmDlg('Desvincular serviços', `Desvincular <b>${rows.length}</b> serviço(s) do agrupamento? Os serviços continuam no cadastro, e as tabelas de tarifas já criadas não perdem valores.`, 'Desvincular', () => {
    const ids = new Set(rows.map(r => r.id)); const gs = new Set(rows.map(r => r.group)); db.links = db.links.filter(l => !ids.has(l.id)); gs.forEach(renumber);
    audit('Serviços desvinculados', [...gs].join(', '), rows.map(r => r.svc).join(', ')); if (GS.links) GS.links.sel.clear(); persist(); rerenderPage(); }, true);
}
ACT.linkDel = el => unlink([linkBy(el.dataset.id)]);
function bulkLink(rows, k, v) { rows.forEach(r => { r[k] = v; if (k === 'def' && !v) r.mandatory = false; }); audit('Vínculos em lote', rows.map(r => r.id).join(', ').slice(0, 300), k + '=' + v); GS.links.sel.clear(); persist(); rerenderPage(); }
function addLinks(gid, codes, base = {}) { const g = grpBy(gid); let n = groupLinks(db, gid).length; const added = []; for (const c of codes) { if (db.links.some(l => l.group === gid && l.svc === c)) continue; db.links.push({ id: gid + '|' + c, group: gid, svc: c, def: base.def ?? true, mandatory: !!base.mandatory, cond: base.cond || null, mult: base.mult || 1, active: true, order: ++n }); added.push(c); } if (added.length) audit('Serviços vinculados', gid, added.join(', ')); return added; }

ACT.linkAddGroups = () => {

  openDialog({ title:'Vincular agrupamentos a um serviço', body:`<div class="f"><label>Serviço</label><select name="s">${db.services.filter(x => x.active).map(x => `<option value="${x.code}">${esc(x.code + ' · ' + x.name)}</option>`).join('')}</select></div>`, actions:[{ label:'Cancelar' }, { label:'Escolher agrupamentos', primary:true, fn: b => { const c = val(b, 's'); setTimeout(() => go2(c), 0); } }] });
};
ACT.linkCopy = () => { const gid = ui.linkGroup; openDialog({ title:'Copiar vínculos para ' + grpLabel(gid), body:`<div class="f"><label>Copiar de</label><select name="g">${db.groups.filter(x => x.id !== gid).map(x => `<option value="${x.id}">${esc(x.id + ' · ' + x.name)} (${grpLinkCount(x.id)})</option>`).join('')}</select></div><p class="muted small">Serviços que já estão no agrupamento não são duplicados. Padrão e obrigatório são copiados.</p>`,
  actions:[{ label:'Cancelar' }, { label:'Copiar', primary:true, fn: b => { const src = val(b, 'g'); let n = 0; for (const l of groupLinks(db, src)) n += addLinks(gid, [l.svc], l).length; persist(); rerenderPage(); toast(n + ' vínculo(s) copiado(s).'); } }] }); };

// ---------- Clientes e regras ----------
PAGES.clientes = { title:'Clientes e regras', sub:'Entidades e tabelas por cliente',
  render() {
    const edit = can('tarifas');
    return `${edit ? '' : noPerm('clientes e regras')}
    <h2 style="font-size:15px;margin:0 0 10px">Entidades</h2>
    <p class="muted small" style="margin-top:0">Proprietário/provedor, entidade comercial, concorrente e cliente são papéis separados. Uma entidade pode ter mais de um papel.</p>
    ${gridHTML({ id:'ents2', rows: () => db.entities, pageSize:10, placeholder:'Pesquisar entidade',
      filters:[{ k:'role', label:'Papel', get: r => r.roles.join('|'), opts: [] }].slice(0, 0),
      toolbar: edit ? `<button class="btn sm pri" data-act="entityNew">${ic('add')} Nova entidade</button>` : '',
      stripe: r => r.roles.includes('Cliente') ? '#2457D6' : r.roles.includes('Concorrente') ? '#B45309' : '#15803D', onRow: r => entityDlg(r),
      columns:[{ k:'id', label:'ID', w:'110px' }, { k:'name', label:'Nome', wrap:true }, { k:'city', label:'Município', get: r => r.city || '' }, { k:'uf', label:'UF', get: r => r.uf || '' }, { k:'email', label:'E-mail de contato', get: r => r.email || '', html: r => r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : '' }, { k:'phone', label:'Telefone', get: r => r.phone || '' }, { k:'roles', label:'Papéis', get: r => r.roles.join(', '), html: r => r.roles.map(x => `<span class="badge">${esc(x)}</span>`).join(' ') },
        { k:'tables', label:'Tarifas', num:true, get: r => ((db.tables.find(t => t.id === MASTER_TABLE) || { entries:[] }).entries.filter(e => e.cust === r.id)).length }, { k:'note', label:'Observação', wrap:true }] })}`;
  } };
ACT.entityNew = () => entityDlg(null);
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
function entityDlg(e) {
  const edit = can('tarifas'), ro = edit ? '' : 'disabled'; const R = ['Provedor','Entidade comercial','Concorrente','Cliente','Repasse'];
  openDialog({ title: e ? e.name : 'Nova entidade', body:`<div class="fg"><div class="f"><label>ID</label><input type="text" name="id" value="${esc(e ? e.id : '')}" ${e ? 'disabled' : ro}></div><div class="f" style="grid-column:span 2"><label>Nome</label><input type="text" name="name" value="${esc(e ? e.name : '')}" ${ro}></div>
      <div class="f" style="grid-column:span 2"><label>Município</label><input type="text" name="city" value="${esc(e && e.city || '')}" ${ro}></div>
      <div class="f"><label>UF</label><select name="uf" ${ro}><option value="">—</option>${UFS.map(u => `<option ${e && e.uf === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
      <div class="f" style="grid-column:span 2"><label>E-mail de contato</label><input type="email" name="email" value="${esc(e && e.email || '')}" placeholder="nome@empresa.com.br" ${ro}></div>
      <div class="f"><label>Telefone</label><input type="tel" name="phone" value="${esc(e && e.phone || '')}" placeholder="(47) 99999-0000" ${ro}></div></div>
    <div class="subh">Papéis</div><div class="row">${R.map(x => `<label class="chk"><input type="checkbox" name="r_${x}" ${e && e.roles.includes(x) ? 'checked' : ''} ${ro}> ${x}</label>`).join('')}</div>
    <div class="f" style="margin-top:12px"><label>Observação</label><textarea name="note" ${ro}>${esc(e ? e.note : '')}</textarea></div>`,
    actions: edit ? [{ label:'Cancelar' }, { label:'Salvar', primary:true, fn: b => {
      const id = e ? e.id : val(b, 'id').trim().toUpperCase().replace(/\s+/g, '-'), name = val(b, 'name').trim(), roles = R.filter(x => val(b, 'r_' + x));
      if (!id || !name) { toast('ID e nome são obrigatórios.'); return false; } if (!roles.length) { toast('Escolha ao menos um papel.'); return false; }
      if (!e && entBy(id)) { toast('ID já existe.'); return false; }
      const contact = { city: val(b, 'city').trim(), uf: val(b, 'uf'), email: val(b, 'email').trim(), phone: val(b, 'phone').trim() };
      if (contact.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email)) { toast('E-mail de contato inválido.'); return false; }
      if (contact.phone && !/^[\d\s()+.-]{8,20}$/.test(contact.phone)) { toast('Telefone inválido: use só números, espaços, parênteses, + ou -.'); return false; }
      if (e) Object.assign(e, { name, roles, note: val(b, 'note'), ...contact }); else db.entities.push({ id, name, roles, note: val(b, 'note'), ...contact });
      audit(e ? 'Entidade editada' : 'Entidade criada', id, name + ' · ' + roles.join(', ')); persist(); rerenderPage();
    } }] : [{ label:'Fechar' }] });
}
function condDlg(c) {
  const edit = can('tarifas'), ro = edit ? '' : 'disabled';
  openDialog({ title: c.name, wide:true, body:`<div class="fg">
    <div class="f" style="grid-column:span 2"><label>Nome</label><input type="text" name="name" value="${esc(c.name)}" ${ro}></div>
    <div class="f"><label>${c.mode === 'minimo' ? 'Valor mínimo (R$)' : 'Taxa padrão (fração: 1 = 100%)'}</label><input type="text" inputmode="decimal" name="rate" value="${c.rate}" ${ro}></div>
    <div class="f"><label>Classificação</label><select name="cls" ${ro}>${Object.entries(CLASSES).map(([k, l]) => `<option value="${k}" ${c.cls === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="f"><label>Status</label><select name="status" ${ro}>${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${c.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="f"><label>Aplicação</label><label class="chk" style="min-height:40px"><input type="checkbox" name="auto" ${c.auto ? 'checked' : ''} ${ro}> Automática</label></div>
    <div class="f"><label>Ajuste na proposta</label><label class="chk" style="min-height:40px"><input type="checkbox" name="over" ${c.overridable ? 'checked' : ''} ${ro}> Pode ser desligada</label></div></div>
    <div class="subh">Base: categorias</div><div class="row">${[...CATEGORIES].map(x => `<label class="chk"><input type="checkbox" name="cat_${x}" ${c.base.categories.includes(x) ? 'checked' : ''} ${ro}> ${x}</label>`).join('')}</div>
    <div class="subh">Base: serviços específicos</div><div class="row">${c.base.services.length ? c.base.services.map(s => `<span class="badge">${esc(s)}</span>`).join(' ') : '<span class="muted small">nenhum</span>'}</div>
    ${edit ? `<div style="margin-top:8px"><button class="btn sm" data-act="condSvcs" data-id="${c.id}">Escolher serviços da base</button></div>` : ''}
    <div class="subh">Taxas próprias por tabela</div>${db.tables.filter(t => t.context !== 'Concorrente').map(t => `<div class="kv"><span>${esc(t.name)}</span><span><input type="text" inputmode="decimal" name="tr_${t.id}" value="${t.condRates && t.condRates[c.id] != null ? t.condRates[c.id] : ''}" placeholder="padrão" style="width:110px;min-height:32px;padding:4px 8px" ${ro}></span></div>`).join('')}
    <p class="muted small">Fonte: ${esc(c.src)}</p>`,
    actions: edit ? [{ label:'Cancelar' }, { label:'Salvar', primary:true, fn: b => {
      const rate = numOrNull(val(b, 'rate')); if (rate == null || isNaN(rate) || rate < 0) { toast('Taxa inválida.'); return false; }
      const cats = CATEGORIES.filter(x => val(b, 'cat_' + x));
      if (!cats.length && !c.base.services.length) { toast('A base precisa ter ao menos uma categoria ou serviço.'); return false; }
      for (const t of db.tables.filter(t => t.context !== 'Concorrente')) { const v = numOrNull(val(b, 'tr_' + t.id)); if (isNaN(v)) { toast('Taxa inválida em ' + t.name); return false; } t.condRates = t.condRates || {}; if (v == null) delete t.condRates[c.id]; else t.condRates[c.id] = v; }
      const before = pct(c.rate) + ' / ' + c.base.categories.join(',');
      Object.assign(c, { name: val(b, 'name').trim() || c.name, rate, cls: val(b, 'cls'), status: val(b, 'status'), auto: val(b, 'auto'), overridable: val(b, 'over') }); c.base.categories = cats;
      audit('Condição editada', c.id, before + ' → ' + pct(c.rate) + ' / ' + cats.join(',')); persist(); rerenderPage();
    } }] : [{ label:'Fechar' }] });
}
ACT.condSvcs = el => { const c = db.conditional.find(x => x.id === el.dataset.id); closeDialog(); pickServices({ title:'Serviços da base: ' + c.name, exclude: c.base.services, onPick: codes => { c.base.services.push(...codes); audit('Base da condição', c.id, '+' + codes.join(',')); persist(); rerenderPage(); setTimeout(() => condDlg(c), 0); } }); };

// ---------- Configurações ----------
PAGES.config = { title:'Configurações', sub:'Impostos, câmbio, tipos de container e auditoria',
  render() {
    const edit = can('config'), ro = edit ? '' : 'disabled', s = db.settings;
    return `${edit ? '' : noPerm('as configurações')}
    <div class="cols c2">
      <div class="card"><h2>Impostos e arredondamento</h2><div class="fg">
        <div class="f"><label>Fator serviços CLIF</label><input type="text" inputmode="decimal" value="${s.fClif}" data-act-change="setNum" data-k="fClif" ${ro}><span class="hint">Valor com impostos = sem impostos ÷ fator</span></div>
        <div class="f"><label>Fator repasse Porto Itapoá</label><input type="text" inputmode="decimal" value="${s.fPorto}" data-act-change="setNum" data-k="fPorto" ${ro}></div>
        <div class="f"><label>Arredondamento</label><input type="text" value="2 casas, por linha (meio para cima)" disabled></div></div></div>
      <div class="card"><h2>Conversão do CIF</h2>
        <div class="row"><label class="chk"><input type="radio" name="fxc" value="BRL_POR_ESTRANGEIRA" data-act-change="fxConv" ${s.fxConvention === 'BRL_POR_ESTRANGEIRA' ? 'checked' : ''} ${ro}> R$ por 1 unidade estrangeira (ex.: 1 USD = R$ 5,00)</label>
        <label class="chk"><input type="radio" name="fxc" value="ESTRANGEIRA_POR_BRL" data-act-change="fxConv" ${s.fxConvention !== 'BRL_POR_ESTRANGEIRA' ? 'checked' : ''} ${ro}> Unidade estrangeira por R$ 1 (ex.: R$ 1 = 0,20 USD)</label></div>
        <p class="muted small">O CIF é sempre convertido para reais antes de qualquer cálculo em % do CIF. Câmbio vazio, zero ou inválido bloqueia o cálculo.</p></div>
    </div>
    <h2 style="font-size:15px;margin:24px 0 10px">Tipos de container</h2>
    ${gridHTML({ id:'cts', rows: () => db.containerTypes, noPage:true, noSearch:true, toolbar: edit ? `<button class="btn sm pri" data-act="ctNew">${ic('add')} Novo tipo</button>` : '',
      stripe: r => r.active ? '#0891B2' : '#9CA3AF',
      columns:[{ k:'id', label:'Código', w:'100px' }, { k:'name', label:'Nome' }, { k:'fallback', label:'Usa tarifa de (se não houver própria)', html: r => edit ? `<select data-act-change="ctFallback" data-id="${r.id}"><option value="">— nenhuma —</option>${db.containerTypes.filter(c => c.id !== r.id).map(c => `<option value="${c.id}" ${r.fallback === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : esc(r.fallback || '—') },
        { k:'active', label:'Ativo', html: r => `<input type="checkbox" data-act-change="ctActive" data-id="${r.id}" ${r.active ? 'checked' : ''} ${ro} aria-label="Ativo">` }, { k:'note', label:'Observação', wrap:true, get: r => r.note || '' }] })}
    <div class="cols c2" style="margin-top:16px">
      <div class="card"><h2>Classificações de serviço</h2>${Object.entries(CLASSES).map(([k, l]) => `<div class="kv"><span>${clsBadge(k)}</span><span class="small muted" style="text-align:right">${esc({ PADRAO:'Pré-selecionado quando o agrupamento indica.', EXTRA:'Opcional, adicionado sob demanda.', NA:'Não se aplica; não gera cobrança.', NAO_COBRAVEL:'Aparece, mas não gera cobrança.', ESPECIAL:'Condição especial; linha separada, nunca substitui a tarifa padrão.', ADICIONAL:'Serviço adicional fora do pacote.' }[k])}</span></div>`).join('')}</div>
      <div class="card"><h2>Bases de cobrança</h2>${Object.values(BASES).map(b => `<div class="kv"><span>${esc(b.label)}</span><span class="small muted">${b.pct ? 'percentual' : 'valor fixo'}</span></div>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:16px"><h2>${ic('warn')} Pendências de validação</h2><ul class="clean">${OPEN_QUESTIONS.map(([k, t]) => `<li><b>${esc(k)}:</b> ${esc(t)}</li>`).join('')}</ul></div>
    <h2 style="font-size:15px;margin:24px 0 10px">Auditoria</h2>
    ${gridHTML({ id:'aud', rows: () => db.audit, pageSize:12, placeholder:'Pesquisar ação, alvo ou usuário', empty:'Nenhuma alteração registrada ainda.',
      columns:[{ k:'at', label:'Data/hora', get: r => r.at, html: r => esc(dt(r.at)) }, { k:'user', label:'Usuário' }, { k:'action', label:'Ação' }, { k:'target', label:'Alvo' }, { k:'detail', label:'Detalhe', wrap:true }] })}
    <div class="card" style="margin-top:16px"><h2>Dados do protótipo</h2><p class="muted small" style="margin-top:0">Os dados ficam no armazenamento deste navegador. Nada é apagado automaticamente.</p>
      <div class="actions"><button class="btn" data-act="exportJSON">${ic('copy')} Copiar dados (JSON)</button>${edit ? `<button class="btn dan" data-act="resetDB">Restaurar dados iniciais…</button>` : ''}</div></div>`;
  } };
ACT_CHANGE.setNum = el => { const v = numOrNull(el.value); if (v == null || isNaN(v) || v <= 0 || v > 1) { toast('Informe um fator entre 0 e 1.'); el.value = db.settings[el.dataset.k]; return; } const old = db.settings[el.dataset.k]; db.settings[el.dataset.k] = v; audit('Configuração', el.dataset.k, old + ' → ' + v); persist(); toast('Fator atualizado.'); };
ACT_CHANGE.fxConv = el => { const old = db.settings.fxConvention; db.settings.fxConvention = el.value; audit('Convenção de câmbio', 'Configurações', old + ' → ' + el.value); persist(); toast('Convenção de câmbio atualizada. Revise o câmbio das simulações.'); };
ACT_CHANGE.ctFallback = el => { const c = ctBy(el.dataset.id); c.fallback = el.value || null; audit('Tipo de container', c.id, 'fallback=' + (c.fallback || '—')); persist(); };
ACT_CHANGE.ctActive = el => { const c = ctBy(el.dataset.id); c.active = el.checked; audit('Tipo de container', c.id, 'ativo=' + c.active); persist(); };
ACT.ctNew = () => openDialog({ title:'Novo tipo de container', body:`<div class="fg"><div class="f"><label>Código</label><input type="text" name="id"></div><div class="f"><label>Nome</label><input type="text" name="name"></div></div>`, actions:[{ label:'Cancelar' }, { label:'Criar', primary:true, fn: b => { const id = val(b, 'id').trim().toUpperCase(), name = val(b, 'name').trim(); if (!id || !name) { toast('Código e nome são obrigatórios.'); return false; } if (ctBy(id)) { toast('Código já existe.'); return false; } db.containerTypes.push({ id, name, fallback:null, active:true }); audit('Tipo de container criado', id, name); persist(); rerenderPage(); } }] });
ACT.exportJSON = () => copyText(JSON.stringify(db, null, 1));
ACT.resetDB = () => confirmDlg('Restaurar dados iniciais', 'Isso substitui tarifas, catálogo, agrupamentos, cenários e histórico deste navegador pelos dados iniciais das planilhas. Copie os dados antes se quiser guardá-los. Continuar?', 'Restaurar', () => { db = seedDB(); sim = clone(DEFAULT_SIM); persist(); render(); toast('Dados iniciais restaurados.'); }, true);

// ---------- início ----------
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!ui.theme) render(); });
render();

</script>
